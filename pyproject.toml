[project]
name = "ingoread-test"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"

authors = []

dependencies = [
    "pydantic>=2.11",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "stickler-eval>=0.7",
]

[project.optional-dependencies]
# Comparators that pull heavy or cloud-backed stacks. field_type: llm_text
# needs `llm`; comparator: SemanticComparator needs `semantic`.
llm = ["stickler-eval[llm]>=0.7"]
semantic = ["stickler-eval[semantic]>=0.7"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
